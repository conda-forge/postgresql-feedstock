{% set version = "18.6" %}
{% set pqver = '.'.join(("5", version.split('.')[0])) %}
{% set llvm_version = "21" %}

package:
  name: postgresql-split
  version: "{{ version }}"

source:
  url: https://ftp.postgresql.org/pub/source/v{{ version }}/postgresql-{{ version }}.tar.bz2
  sha256: 555610c24d53e4316da5b7d3fc25c279d96856d5e0e23ee308c328c5fa881d9f
  patches:
    - patches/0002-disable-new-dtags.patch
    - patches/fix_gssapi_setenv_win.patch  # [win]
    - patches/fix_auth_setenv_win.patch  # [win]
    - patches/fix_x509_name_win.patch  # [win]

build:
  number: 3

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - gnuconfig        # [unix]
    - meson            # [win]
    - {{ stdlib("c") }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - make             # [unix]
    - pkg-config       # [unix]
    - bison            # [unix]
    - ninja            # [win]
    - perl 5.*         # [win]
    - m2-base          # [win]
    - m2-bison         # [win]
    - m2-diffutils     # [win]
    - m2-flex          # [win]
    - icu
    - clang {{ llvm_version }}.*       # [unix]
    - llvmdev {{ llvm_version }}.*     # [unix]
    - llvm-tools {{ llvm_version }}.*  # [unix]
  host:
    - icu
    - liburing        # [linux]
    - libxml2-devel
    - libxslt
    - krb5
    - openldap        # [not win]
    - openssl
    - lz4-c
    - zlib
    - zstd
    - vc              # [win]
    - libuuid         # [not win]
    - readline        # [not win]
    - tzcode          # [not win]
    - tzdata          # [not win]
  run:
    - krb5
    - openldap        # [not win]
    - openssl
    - readline        # [not win]
    - tzcode          # [not win]
    - tzdata          # [not win]

outputs:
  - name: postgresql
    build:
      run_exports:
        - {{ pin_subpackage('libpq') }}
    requirements:
      build:
        - gnuconfig            # [unix]
        - meson                # [win]
        # solely for sake of lining up vc versions and other runtimes
        - {{ stdlib("c") }}
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - make                 # [unix]
        - pkg-config           # [unix]
        - bison                # [unix]
        - ninja                # [win]
        - perl 5.*             # [win]
        - m2-base              # [win]
        - m2-bison             # [win]
        - m2-diffutils         # [win]
        - m2-flex              # [win]
        - icu
        - clang {{ llvm_version }}.*       # [unix]
        - llvmdev {{ llvm_version }}.*     # [unix]
        - llvm-tools {{ llvm_version }}.*  # [unix]
      host:
        # these are here for sake of run_exports taking effect
        - icu
        - liburing            # [linux]
        - libxml2-devel
        - libxslt
        - krb5
        - openldap            # [not win]
        - openssl
        - lz4-c
        - zlib
        - zstd
        - readline            # [not win]
        - tzcode              # [not win]
        - tzdata              # [not win]
        - {{ pin_subpackage('libpq', exact=True) }}
      run:
        - {{ pin_subpackage('libpq', exact=True) }}
        - tzcode              # [not win]
        - tzdata              # [not win]

    test:
      commands:
        - test -f $PREFIX/bin/postgres                    # [unix]
        - $PREFIX/bin/postgres --help                     # [unix]
        - IF NOT EXIST %LIBRARY_BIN%\postgres.exe EXIT 1  # [win]
        - postgres --help                                 # [win]
        # run a simple initdb check on unix
        - export PGDATA=$SRC_DIR/test_postgres                                # [unix]
        - $PREFIX/bin/initdb                                                  # [unix]
        - $PREFIX/bin/pg_ctl -l $PGDATA/logfile start || cat $PGDATA/logfile  # [unix]
        - $PREFIX/bin/pg_ctl stop                                             # [unix]
        # Make sure that postgres contains `palloc0` symbol
        - nm -D $PREFIX/bin/postgres | grep -q palloc0 || exit 1             # [linux]
        # Make sure that llvmjit is not installed with this package
        - test ! -e $PREFIX/lib/llvmjit.so                # [linux]
        - test ! -e $PREFIX/lib/llvmjit.dylib             # [osx]
        - test ! -e $PREFIX/lib/llvmjit_types.bc          # [unix]
      requirements:
        - binutils   # [linux]
    script: install_db.sh  # [unix]
    script: install_db.bat  # [win]
    about:
      summary: PostgreSQL is a powerful, open source object-relational database system.
      license: PostgreSQL
      license_file: COPYRIGHT

  - name: postgresql-jit
    build:
      skip: true  # [win or build_platform != target_platform]
    script: install_jit.sh
    requirements:
      build:
        - make  # [unix]
      run:
        - {{ pin_subpackage('postgresql', exact=True) }}
        - libllvm{{ llvm_version }} {{ llvm_version }}.*  # [unix]
    test:
      commands:
        - test -f $PREFIX/lib/llvmjit.so                  # [linux]
        - test -f $PREFIX/lib/llvmjit.dylib               # [osx]
        - test -f $PREFIX/lib/llvmjit_types.bc
        - export PGDATA=$SRC_DIR/test_postgres_jit
        - $PREFIX/bin/initdb
        - $PREFIX/bin/pg_ctl -l $PGDATA/logfile start || cat $PGDATA/logfile
        - $PREFIX/bin/psql -d postgres -Atqc "SELECT setting FROM pg_settings WHERE name = 'jit_provider';" | grep -x llvmjit
        - $PREFIX/bin/psql -d postgres -Atqc "SET jit = on; SELECT pg_jit_available();" | grep -x t
        - $PREFIX/bin/psql -d postgres -Atqc "SET jit = on; SET jit_above_cost = 0; EXPLAIN ANALYZE SELECT sum(i) FROM generate_series(1, 10000000) AS i;" | grep -q 'JIT:'
        - $PREFIX/bin/pg_ctl stop
    about:
      summary: Optional LLVM JIT provider for PostgreSQL
      license: PostgreSQL
      license_file: COPYRIGHT

  - name: postgresql-plpython
    build:
      run_exports:
        - {{ pin_subpackage('postgresql-plpython') }}
      # needs packaging help on windows
      skip: true  # [win]
    requirements:
      build:
        - python                                 # [build_platform != target_platform]
        - libpython                              # [build_platform != target_platform]
        - cross-python_{{ target_platform }}     # [build_platform != target_platform]
        - gnuconfig              # [unix]
        - meson                  # [win]
        # solely for sake of lining up vc versions and other runtimes
        - {{ stdlib("c") }}
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - make                   # [unix]
        - pkg-config             # [unix]
        - bison                  # [unix]
        - ninja                  # [win]
        - perl 5.*               # [win]
        - m2-bison               # [win]
        - m2-diffutils           # [win]
        - m2-flex                # [win]
        - icu
        - clang {{ llvm_version }}.*       # [unix]
        - llvmdev {{ llvm_version }}.*     # [unix]
        - llvm-tools {{ llvm_version }}.*  # [unix]
      host:
        # these are here for sake of run_exports taking effect
        - icu
        - libxml2-devel
        - libxslt
        - krb5
        - openldap               # [not win]
        - openssl
        - lz4-c
        - zlib
        - zstd
        - vc                     # [win]
        - libuuid                # [not win]
        - readline               # [not win]
        - {{ pin_subpackage('postgresql', exact=True) }}
        - python
        - libpython
      run:
        - {{ pin_subpackage('postgresql', exact=True) }}
        - python
    script: install_plpython.sh  # [unix]
    test:
      commands:
    about:
      summary: The plpython postgresql extension
      license: PostgreSQL
      license_file: COPYRIGHT

  - name: libpq
    build:
      run_exports:
        - {{ pin_subpackage('libpq') }}
    requirements:
      build:
        - gnuconfig              # [unix]
        - meson                  # [win]
        # solely for sake of lining up vc versions and other runtimes
        - {{ stdlib("c") }}
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - make                   # [unix]
        - pkg-config             # [unix]
        - bison                  # [unix]
        - ninja                  # [win]
        - perl 5.*               # [win]
        - m2-base                # [win]
        - m2-bison               # [win]
        - m2-diffutils           # [win]
        - m2-flex                # [win]
        - icu
        - clang {{ llvm_version }}.*       # [unix]
        - llvmdev {{ llvm_version }}.*     # [unix]
        - llvm-tools {{ llvm_version }}.*  # [unix]
      host:
        # these are here for sake of run_exports taking effect
        - icu
        - krb5
        - openldap               # [not win]
        - openssl
        - tzcode                 # [not win]
        - tzdata                 # [not win]
    script: install_runtime.sh   # [unix]
    script: install_runtime.bat  # [win]
    test:
      commands:
        - test -f $PREFIX/lib/libpq.so.{{ pqver }}         # [linux]
        - test -f $PREFIX/lib/libpq.so.5                   # [linux]
        - test -f $PREFIX/lib/libpq.so                     # [linux]
        - test -f $PREFIX/lib/libpq.5.dylib                # [osx]
        - test -f $PREFIX/lib/libpq.dylib                  # [osx]
        - IF NOT EXIST %LIBRARY_BIN%\libpq.dll EXIT 1      # [win]
        - test -f $PREFIX/bin/pg_config                    # [unix]
        - $PREFIX/bin/pg_config                            # [unix]
        - IF NOT EXIST %LIBRARY_BIN%\pg_config.exe EXIT 1  # [win]
        - pg_config                                        # [win]
        # Make sure llvmjit is not installed with this package
        - test ! -e $PREFIX/lib/llvmjit.so                 # [linux]
        - test ! -e $PREFIX/lib/llvmjit.dylib              # [osx]
        - test ! -e $PREFIX/lib/llvmjit_types.bc           # [unix]
    about:
      summary: The postgres runtime libraries and utilities (not the server itself)
      license: PostgreSQL
      license_file: COPYRIGHT

about:
  home: http://www.postgresql.org/
  license: PostgreSQL
  license_file: COPYRIGHT
  summary: multi-ouput recipe for postgresql

extra:
  recipe-maintainers:
    - akrherz
    - flaviomartins
    - gillins
    - msarahan
    - ocefpaf
    - mariusvniekerk
    - sodre
